syntax = "proto3";

package parity3;

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
  BLUE = 3;
}

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color f_enum = 16;
  optional int32 opt_int32 = 17;
  optional string opt_string = 18;
  optional double opt_double = 19;
  Scalars child = 20;
  uint32 big_number = 536870911;
}

message Repeated {
  repeated double r_double = 1;
  repeated int32 r_int32 = 2;
  repeated sint64 r_sint64 = 3;
  repeated fixed32 r_fixed32 = 4;
  repeated bool r_bool = 5;
  repeated Color r_enum = 6;
  repeated string r_string = 7;
  repeated bytes r_bytes = 8;
  repeated Scalars r_message = 9;
  repeated int32 unpacked = 10 [packed = false];
}

message Choice {
  oneof kind {
    string s = 1;
    int64 i = 2;
    Scalars m = 3;
    Color c = 4;
    bytes b = 5;
  }
  string after = 6;
}

message Maps {
  map<string, string> ss = 1;
  map<int32, Scalars> im = 2;
  map<string, int64> si = 3;
  map<bool, string> bs = 4;
}

message Tree {
  string label = 1;
  repeated Tree children = 2;
  Tree parent = 3;
}

message Wide {
  int32 a = 1;
  int32 b = 2;
  string c = 3;
}

message Narrow {
  int32 b = 2;
}
