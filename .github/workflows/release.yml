name: Release

on:
  push:
    tags:
      - "v*"
  # Dry-run: build + verify the packaged gem without publishing anything.
  workflow_dispatch:

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for RubyGems trusted publishing
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4

      - name: Build gem
        run: |
          gem build fast-protowire.gemspec
          mkdir -p pkg/
          mv *.gem pkg/

      # The pre-release rule: install the built .gem into an isolated GEM_HOME
      # and exercise it from there — the checkout's lib/ is never on the load
      # path — so a file missing from spec.files or a require-path mistake
      # fails here, not after publishing. The gem has no runtime dependencies,
      # so the install is offline.
      - name: Verify the packaged gem
        run: |
          export GEM_HOME="$RUNNER_TEMP/gemhome"
          gem install --local --no-document pkg/fast-protowire-*.gem
          cd "$RUNNER_TEMP"
          ruby -e '
            require "fast/protowire"
            klass = Class.new(Fast::Protowire::Message) do
              field :name, :string, 1
              repeated :value, :double, 2
            end
            bytes = klass.new(name: "ok", value: [1.5]).encode
            raise "round trip failed" unless klass.decode(bytes).name == "ok"
            puts Fast::Protowire::VERSION
          '

      # Trusted publishing: no API token. Auth is a short-lived OIDC
      # credential minted at run time, scoped to this repo + workflow
      # (rubygems.org trusted publisher: jetpks/fast-protowire, release.yml).
      - name: Configure RubyGems credentials
        if: ${{ fromJSON(env.IS_TAG) }}
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish to RubyGems
        if: ${{ fromJSON(env.IS_TAG) }}
        run: gem push pkg/fast-protowire-*.gem

      - name: Smoke-test the published gem
        if: ${{ fromJSON(env.IS_TAG) }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            gem install fast-protowire --version "$version" && break
            echo "not indexed yet (attempt $attempt) — retrying in 15s"
            sleep 15
          done
          ruby -e 'require "fast/protowire"; puts Fast::Protowire::VERSION' | grep -Fx "$version"

      - name: Create GitHub Release
        if: ${{ fromJSON(env.IS_TAG) }}
        uses: softprops/action-gh-release@v3
        with:
          files: pkg/*.gem
          generate_release_notes: true
          # Prerelease tags (e.g. v0.1.0.pre.1) must not be marked "latest".
          prerelease: ${{ contains(github.ref_name, '.rc') || contains(github.ref_name, '.beta') || contains(github.ref_name, '.alpha') || contains(github.ref_name, '.pre') || contains(github.ref_name, '-') }}
